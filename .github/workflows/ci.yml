name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'root' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_secure_test_pass_123' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'ev_erp_test' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d ev_erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U ${{ secrets.POSTGRES_USER || 'root' }} && break || sleep 1
          done

      - name: Run DB migrations
        working-directory: ./backend
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://${{ secrets.POSTGRES_USER || 'root' }}:${{ secrets.POSTGRES_PASSWORD || 'ci_secure_test_pass_123' }}@localhost:5432/${{ secrets.POSTGRES_DB || 'ev_erp_test' }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci_test_jwt_secret_key_32_characters_long' }}
          REDIS_URL: ${{ secrets.REDIS_URL || 'redis://localhost:6379/0' }}
        run: alembic upgrade head

      - name: Run Backend Tests
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://${{ secrets.POSTGRES_USER || 'root' }}:${{ secrets.POSTGRES_PASSWORD || 'ci_secure_test_pass_123' }}@localhost:5432/${{ secrets.POSTGRES_DB || 'ev_erp_test' }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci_test_jwt_secret_key_32_characters_long' }}
          REDIS_URL: ${{ secrets.REDIS_URL || 'redis://localhost:6379/0' }}
          PYTHONPATH: backend
        run: pytest backend/tests/

  frontend-ci:
    name: Frontend CI & E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'root' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_secure_test_pass_123' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'ev_erp_test' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d ev_erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U ${{ secrets.POSTGRES_USER || 'root' }} && break || sleep 1
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Linting
        working-directory: ./frontend
        run: npm run lint

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Run Playwright E2E Tests
        working-directory: ./frontend
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://${{ secrets.POSTGRES_USER || 'root' }}:${{ secrets.POSTGRES_PASSWORD || 'ci_secure_test_pass_123' }}@localhost:5432/${{ secrets.POSTGRES_DB || 'ev_erp_test' }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci_test_jwt_secret_key_32_characters_long' }}
          REDIS_URL: ${{ secrets.REDIS_URL || 'redis://localhost:6379/0' }}
          PYTHONPATH: backend
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'http://localhost:8000' }}
          PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.PLAYWRIGHT_TEST_BASE_URL || 'http://localhost:3000' }}
        run: npx playwright test
